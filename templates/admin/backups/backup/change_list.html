{% extends "admin/change_list.html" %}

{% block object-tools %}
<div style="margin-bottom: 20px;">
    <form method="post" action="{% url 'admin:backups_backup_generar' %}">
        {% csrf_token %}

        <label for="nombre_backup">
            Nombre de la copia de seguridad:
        </label>

        <input type="text" id="nombre_backup" name="nombre_backup" maxlength="120" placeholder="Ej. Backup_CitaHN"
            required style="margin: 8px; padding: 6px;">

        <button type="submit" class="button">
            Generar y descargar backup
        </button>
    </form>
</div>

{{ block.super }}
{% endblock %}
